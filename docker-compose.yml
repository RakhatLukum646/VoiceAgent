name: deep
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
  livekit:
    image: livekit/livekit-server:v1.9.12
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
  voice-rag:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - livekit
      - qdrant
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./data:/app/data
volumes:
  qdrant-data:
